[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Depreciações passam a falhar os testes, para apanhar quebras futuras cedo.
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

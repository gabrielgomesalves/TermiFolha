[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Depreciações e FutureWarning passam a falhar os testes, para apanhar quebras futuras cedo.
filterwarnings = ["error::DeprecationWarning", "error::FutureWarning"]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
